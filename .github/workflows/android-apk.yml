name: Build WOLF APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-companion/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-companion
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wolf-debug-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
